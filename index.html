<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Notas - Universidad de la Costa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label for="inputNota1">Nota 1:</label>
        <input type="number" id="inputNota1" step="0.1">

        <label for="inputNota2">Nota 2:</label>
        <input type="number" id="inputNota2" step="0.1">

        <label for="inputNota3">Nota 3:</label>
        <input type="number" id="inputNota3" step="0.1">

        <button onclick="calcularPromedioNotas()">Calcular</button>

        <p id="parrafoResultado"></p>
        <p id="parrafoEstado"></p>
    </div>

<script>
const TOTAL_NOTAS = 3;

function calcularPromedioNotas() {
    let nota1 = parseFloat(document.getElementById("inputNota1").value);
    let nota2 = parseFloat(document.getElementById("inputNota2").value);
    let nota3 = parseFloat(document.getElementById("inputNota3").value);

    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("parrafoResultado").innerHTML = "Debe ingresar las tres notas.";
        document.getElementById("parrafoEstado").innerHTML = "";
        return;
    }

    let resultadoPromedio = (nota1 + nota2 + nota3) / TOTAL_NOTAS;

    document.getElementById("parrafoResultado").innerHTML = "Promedio: " + resultadoPromedio.toFixed(2);

    if (resultadoPromedio >= 3.0) {
        document.getElementById("parrafoEstado").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("parrafoEstado").innerHTML = "Resultado: reprobado";
    }
}
</script>

</body>
</html>
